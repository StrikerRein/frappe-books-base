  <style>

t[type=checkbox]{width:18px;height:18px;display:inline-block;margin:0;vertical-align:middle;accent-color:#174f65}.field{margin-top:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}.table-wrap{overflow:auto;max-height:360px;margin-top:18px}table{border-collapse:collapse;width:100%;font-size:14px}th{position:sticky;top:0;z-index:1;color:#647585;font-size:12px;font-weight:650;text-align:left;background:#f4f7f9}td,th{padding:13px 10px;border-bottom:1px solid #e5ebef;vertical-align:top}.amount{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.desc{min-width:240px}.muted{color:#647585;font-size:12px;line-height:1.5;margin-top:4px}.tag{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;background:#eff3f6;color:#506575;white-space:nowrap}.tag.Answered{background:#def0e6;color:#176b41}.tag.Follow-up{background:#fff1d2;color:#84620d}.tag.Reviewed{background:#e6eaf7;color:#435584}.review-card{border-left:4px solid #b1cbd5}.question{font-size:17px;line-height:1.6;margin:17px 0}.tx{background:#f4f7f9;border-radius:8px;padding:15px;line-height:1.55}.tx .amount{float:right;font-size:18px;color:#173e54;font-weight:700;margin-left:15px}.note{padding:12px 14px;background:#edf5f7;border-radius:8px;font-size:14px;line-height:1.6;margin-top:16px}.empty{padding:32px 15px;text-align:center;color:#647585}.empty strong{display:block;color:#263e4c;font-size:18px;margin-bottom:8px}#notice{position:sticky;top:10px;z-index:5;background:#e1f1e8;color:#155932;border-radius:9px;padding:13px 18px;margin-bottom:18px}#notice.error{background:#fde7e5;color:#982c25}[hidden]{display:none!important}.check-label{display:flex;align-items:center;gap:8px;font-weight:400}.audit{font-size:12px;color:#647585;line-height:1.6}.loading{padding:50px;text-align:center}.foot{font-size:12px;color:#647585;margin-top:25px;line-height:1.6}
    @media(max-width:700px){header{padding:16px 20px;align-items:start}.brand{font-size:18px}.who{max-width:145px}.who a{display:block!important;margin:6px 0 0!important}main{padding:23px 16px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{min-width:0;flex:1;padding:13px}.stat strong{font-size:24px}.stat span{font-size:11px}.panel{padding:18px}.intro h1{font-size:25px}.tx .amount{float:none;margin:0 0 8px;text-align:left}.actions button{flex:1}.filters button{width:100%}}

    .eyebrow{font-size:12px;letter-spacing:.1em;color:#647585;font-weight:700}.review-controls{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-top:22px}.review-controls label{min-width:130px}.review-controls label:nth-child(2){flex:1}.client-tabs{flex-wrap:wrap}.entity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.entity-card .big-count{font-size:32px;font-weight:700;margin:20px 0}.big-count small{font-size:14px;font-weight:400;color:#647585}.entity-counts{display:flex;justify-content:space-between;gap:12px;margin:20px 0;font-size:12px}.entity-counts strong{display:block;font-size:20px;margin-top:6px}progress{width:100%;height:10px;accent-color:#174f65}.focus-card{max-width:850px;margin:20px auto}.transaction-head h2{font-size:25px;line-height:1.4;margin:8px 0 20px}.transaction-head p{font-size:21px;font-weight:700;margin-top:20px}.choice-row{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.choice-row [aria-pressed=true]{background:#174f65;color:white;border-color:#174f65}.split-panel{padding:20px;background:#edf5f7;border-radius:9px}.split-panel input[type=number]{max-width:150px}.split-panel input[type=range]{padding:0;accent-color:#174f65}.request-title{font-size:24px!important;margin-top:20px!important}.progress-line{border-bottom:1px solid #e5ebef;padding:20px 0}.progress-line progress{margin-top:12px}.journey{display:flex;gap:12px;flex-wrap:wrap;padding:20px;list-style:decimal}.journey li{padding:8px;color:#647585}.journey .current{background:#e0eef1;color:#174f65;border-radius:8px;font-weight:700}@media(max-width:700px){.review-controls label{width:100%}.client-tabs button{flex:1}.transaction-head h2{font-size:21px}.entity-grid{display:block}.focus-card{padding:20px}}

<body data-csrf="{{ csrf_token | e }}">
  <header><div class="brand">Streicher Books<small>Client review portal</small></div><div class="who"><span id="user-name">Secure review inbox</span><button id="sign-out" type="button">Sign out</button></div></header>
  <main><div id="notice" role="status" hidden></div><div id="app"><div class="loading">Loading your review inbox…</div></div></main>
<script>
const app=document.getElementById('app'),notice=document.getElementById('notice');
let profile,items=[],mode='assign',selected=new Set(),transactions=[],hasMore=false,selectedClient='',selectedSite='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v||0));
const el=id=>document.getElementById(id);
function message(text,error=false){notice.textContent=text;notice.className=error?'error':'';notice.hidden=false;notice.scrollIntoView({block:'nearest',behavior:'smooth'});}
async function api(method,args={},write=false){
  const url='/api/method/frappe_books.review_portal.'+method;
  const response=await fetch(write?url:url+'?'+new URLSearchParams(Object.fromEntries(Object.entries(args).map(([k,v])=>[k,typeof v==='string'?v:JSON.stringify(v)]))),{method:write?'POST':'GET',credentials:'same-origin',headers:write?{'Content-Type':'application/json','X-Frappe-CSRF-Token':document.body.dataset.csrf}:{},body:write?JSON.stringify(args):undefined});
  const data=await response.json();
  if(!response.ok){let error='The request could not be completed.';try{const messages=JSON.parse(data._server_messages||'[]');if(messages.length)error=JSON.parse(messages[0]).message.replace(/<[^>]*>/g,'');}catch{}throw new Error(error);}
  return data.message;
}
function counts(){return `<div class="stats"><div class="stat"><strong>${items.filter(t=>['Open','Follow-up'].includes(t.status)).length}</strong><span>Waiting for answers</span></div><div class="stat"><strong>${items.filter(t=>t.status==='Answered').length}</strong><span>Ready for accountant</span></div><div class="stat"><strong>${items.filter(t=>t.status==='Reviewed').length}</strong><span>Review complete</span></div></div>`;}
function intro(){return `<div class="intro"><h1>${profile.accountant?'Client review desk':'Your review inbox'}</h1><p>${profile.accountant?'Assign specific transactions or questions to your clients. Check their answers before making accounting changes.':'Your accountant has selected these items for you. Explain what each transaction was for and whether it was business, private, rental, or mixed use.'}</p></div>${counts()}`;}
function options(values,current){return values.map(([value,label])=>`<option value="${esc(value)}"${value===current?' selected':''}>${esc(label)}</option>`).join('');}
function txSummary(t){const row=t.transaction;if(!row?.name)return '';return `<div class="tx"><div class="amount">${money(row.money_out||row.money_in)} ${row.source_kind==='ledger'?(Number(row.ledger_debit)>0?'debit':'credit'):(Number(row.money_out)>0?'paid':'received')}</div><strong>${esc(row.description)}</strong><div class="muted">${esc(row.transaction_date)} · ${esc(row.reference)}<br>Current category: ${esc(row.offset_account)}</div></div>`;}
function transactionRows(){if(!transactions.length)return '<div class="empty"><strong>Find the transactions to review</strong>Choose a client and account, then search by description or date.</div>';return `<div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="all-transactions" aria-label="Select all visible transactions"></th><th>Date / reference</th><th>Bank description</th><th class="amount">Paid</th><th class="amount">Received</th><th>Current category</th></tr></thead><tbody>${transactions.map(t=>`<tr><td><input type="checkbox" data-select="${esc(t.name)}" aria-label="Select ${esc(t.reference)}"${selected.has(t.name)?' checked':''}></td><td>${esc(t.transaction_date)}<div class="muted">${esc(t.reference)}</div></td><td class="desc">${esc(t.description)}</td><td class="amount">${money(t.money_out)}</td><td class="amount">${money(t.money_in)}</td><td>${esc(t.offset_account)}<div class="muted">${esc(t.classification)}</div></td></tr>`).join('')}</tbody></table></div>${hasMore?'<p class="sub">Showing the first 200 matches. Narrow the dates or description to find more.</p>':''}`;}
function assignment(){const client=profile.clients.find(c=>c.email===selectedClient);const sites=(client?.sources||[]).map(s=>[s,profile.sources[s]]);if(!sites.some(([s])=>s===selectedSite))selectedSite=sites[0]?.[0]||'';
return `<section class="panel"><h2>Assign a review</h2><p class="sub">Each client can see only the items assigned to them in their permitted accounts.</p><div class="grid"><label>Client<select id="client">${options(profile.clients.map(c=>[c.email,c.label||c.email]),selectedClient)}</select></label><label>Account / business<select id="source">${options(sites,selectedSite)}</select></label></div><div class="filters field"><label>From date<input type="date" id="from-date" value="2025-03-01"></label><label>To date<input type="date" id="to-date" value="2026-02-28"></label><label>Bank description<input id="search" placeholder="e.g. electricity, rent, supplier"></label><button type="button" id="find">Find transactions</button></div><div id="transaction-table">${transactionRows()}</div><p id="selected-count" class="sub field">${selected.size} selected</p><label class="field">Question or instructions<textarea id="question" placeholder="Please explain what this payment was for. If it was partly business or rental, give the percentage and how you calculated it."></textarea></label><label>Tax year<input id="assign-year" type="number" min="2000" max="2100" value="${reviewYear}"></label><label class="field">Due date (optional)<input type="date" id="due-date"></label><div class="actions"><button class="primary" id="assign">Assign selected transactions</button><button id="assign-question">Assign a question without a transaction</button></div><p class="foot">Answers return for your review. Assigning or completing a review does not post a journal or change a category. No invitation or notification emails are sent by this preview.</p></section>`;}
function clientCard(t){return `<section class="panel review-card" data-task="${esc(t.name)}"><div class="filters"><h2>${esc(t.company)}</h2><span class="tag ${esc(t.status)}">${esc(t.status)}</span></div><p class="muted">${esc(t.name)}${t.due_date?' · Due '+esc(t.due_date):''}</p>${t.workflow?`<p class="muted">Workflow: ${esc(t.workflow_title)} · ${esc(t.workflow_stage)}</p>`:''}<p class="question">${esc(t.question)}</p>${txSummary(t)}${t.review_note?`<div class="note"><strong>Accountant note</strong><br>${esc(t.review_note)}</div>`:''}${t.status==='Reviewed'?`<div class="note"><strong>Your answer</strong><br>${esc(t.classification)}${t.classification==='Mixed'?' · '+esc(t.percentage)+'% business/rental':''}<br>${esc(t.answer)}</div>`:`<div class="grid field"${t.kind==='Question'?' hidden':''}><label>How was this used?<select data-answer-use>${options([['Unsure','Not sure — please help'],['Business','Business'],['Private','Private'],['Rental','Rental property'],['Transfer','Transfer between accounts'],['Mixed','Mixed business/rental and private']],t.classification||'Unsure')}</select></label><label data-percentage-label${t.classification==='Mixed'?'':' hidden'}>Business or rental share (%)<input type="number" min="0.01" max="99.99" step="0.01" data-answer-percentage value="${esc(t.percentage||50)}"></label></div><label class="field">${t.kind==='Question'?'Your answer':'Explain the transaction'}<textarea data-answer-text placeholder="${t.kind==='Question'?'Answer your accountant’s question.':'What was this for? Include the business/rental purpose or how you estimated a split.'}">${esc(t.answer||'')}</textarea></label><label class="field"${t.kind==='Question'?' hidden':''}>Suggested category (optional)<input data-answer-category value="${esc(t.suggested_category||'')}" placeholder="e.g. ingredients, telephone, rental repairs"></label><div class="actions"><button class="primary" data-send-answer="${esc(t.name)}">${t.status==='Answered'?'Update answer':'Send answer to accountant'}</button><span class="muted">${t.status==='Answered'?'Your answer is awaiting accountant review.':'Your answer will not change the accounts automatically.'}</span></div>`}</section>`;}
function managerCard(t){const row=t.transaction;return `<section class="panel review-card" data-task="${esc(t.name)}"><div class="filters"><h2>${esc(t.company)}</h2><span class="tag ${esc(t.status)}">${esc(t.status)}</span></div><p class="muted">${esc(t.client)} · ${esc(t.name)}${t.due_date?' · Due '+esc(t.due_date):''}</p>${t.workflow?`<p class="muted">Workflow: ${esc(t.workflow_title)} · ${esc(t.workflow_stage)}</p>`:''}<p class="question">${esc(t.question)}</p>${txSummary(t)}${t.attachments?.length?`<h3>Uploaded documents</h3><ul>${attachmentLinks(t)}</ul>`:''}${row?.name&&t.source_url?`<p><a href="${esc(t.source_url)}" target="_blank" rel="noopener">Open accounting source</a></p>`:''}${t.answer?`<div class="note"><strong>Client answer: ${esc(t.classification)}${t.classification==='Mixed'?' · '+esc(t.percentage)+'% business/rental':''}</strong><br>${esc(t.answer)}${t.suggested_category?'<br>Suggested category: '+esc(t.suggested_category):''}</div>`:'<p class="sub field">Waiting for the client to answer.</p>'}<label class="field">Your review note / follow-up question<textarea data-review-note placeholder="Record your decision or ask the client for more detail.">${esc(t.review_note||'')}</textarea></label><div class="actions"><button class="primary" data-review="Reviewed" data-id="${esc(t.name)}"${t.status==='Answered'?'':' disabled'}>Complete review</button><button data-review="Follow-up" data-id="${esc(t.name)}">Request follow-up</button></div>${t.kind==='Transaction'&&t.propose_rule?`<div class="note">Client suggested using the ${esc(t.percentage)}% split for similar payments.</div>`:''}${(t.matching_rules||[]).map(r=>`<div class="note"><strong>Approved split: ${esc(r.percentage)}%</strong> · ${esc(r.match_text)}<br><a href="${esc(r.apply_url)}" target="_blank" rel="noopener">Review matching transactions for bulk allocation</a></div>`).join('')}${t.status==='Reviewed'&&t.propose_rule&&t.classification==='Mixed'?`<label class="field">Similar bank descriptions contain<input data-rule-match maxlength="200" value="${esc(row.description||'')}"></label><label class="field">Rule approval note<textarea data-rule-note maxlength="4000"></textarea></label><button class="field" data-approve-split="${esc(t.name)}">Approve repeat-use split rule</button>`:''}<details class="field"><summary>Review history</summary><div class="audit">${(t.history||[]).map(h=>`<p><strong>${esc(h.action)}</strong> · ${esc(h.at)} · ${esc(h.by)}<br>${esc(h.question||h.answer||h.note||'')}</p>`).join('')}</div></details><p class="foot">Complete review records your decision; apply any category change separately in Books after checking the source.</p></section>`;}
function reviewList(){const filter=el('status-filter')?.value||'';const list=items.filter(t=>!filter||t.status===filter);el('review-list').innerHTML=list.length?list.map(profile.accountant?managerCard:clientCard).join(''):`<div class="panel empty"><strong>${items.length?'No reviews match this status':'No assigned reviews yet'}</strong>${profile.accountant?'Use Assign reviews to send a question or select bank transactions.':'Your accountant will place specific questions and transactions here.'}</div>`;}
function renderLegacy(){app.innerHTML=intro()+(profile.accountant?`<div class="tabs"><button data-mode="assign" class="${mode==='assign'?'active':''}">Assign reviews</button><button data-mode="inbox" class="${mode==='inbox'?'active':''}">Answers and follow-ups</button><button data-mode="requests">Documents / questions</button><button data-mode="progress">Progress</button><button id="preview-client">Preview client view</button><a href="/books/workflows" style="margin:auto 15px auto auto">Workflows</a><a href="/books/" style="margin:auto 0 auto auto">Open Books</a></div>`:'')+((profile.accountant&&mode==='assign')?assignment():`<div class="filters" style="margin-bottom:18px"><label>Status<select id="status-filter">${options([['','All assigned items'],['Open','Waiting for answer'],['Answered','Answered'],['Follow-up','Follow-up requested'],['Reviewed','Review complete']],'')}</select></label><button id="refresh">Refresh inbox</button></div><div id="review-list"></div>`);if(el('review-list'))reviewList();}
async function reload(){if(previewOwner){const result=await api('preview_client',{client:selectedClient,tax_year:reviewYear});profile=result.profile;items=result.items;clientOverview=result.overview;}else{items=await api('list_reviews',{tax_year:reviewYear});clientOverview=await api('overview',{tax_year:reviewYear});}render();}
async function guarded(button,action){button.disabled=true;notice.hidden=true;try{await action();}catch(e){message(e.message,true);}finally{if(button.isConnected)button.disabled=false;}}
document.getElementById('sign-out').addEventListener('click',async()=>{
  const button=document.getElementById('sign-out');
  await guarded(button,async()=>{
    const response=await fetch('/api/method/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Frappe-CSRF-Token':document.body.dataset.csrf},body:'{}'});
    if(!response.ok)throw new Error('Sign out could not be completed. Please try again.');
    window.location.href='/login?redirect-to=%2Fclient-review';
  });
});
app.addEventListener('change',async event=>{
 const target=event.target;
 if(target.id==='client'){selectedClient=target.value;selectedSite='';transactions=[];selected.clear();render();}
 if(target.id==='source'){selectedSite=target.value;transactions=[];selected.clear();el('transaction-table').innerHTML=transactionRows();el('selected-count').textContent='0 selected';}
 if(target.dataset.select){target.checked?selected.add(target.dataset.select):selected.delete(target.dataset.select);el('selected-count').textContent=selected.size+' selected';}
 if(target.id==='all-transactions'){selected=target.checked?new Set(transactions.slice(0,50).map(t=>t.name)):new Set();el('transaction-table').innerHTML=transactionRows();el('selected-count').textContent=selected.size+' selected (maximum 50 per assignment)';}
 if(target.id==='status-filter')reviewList();
 if(target.matches('[data-answer-use]'))target.closest('[data-task]').querySelector('[data-percentage-label]').hidden=target.value!=='Mixed';
});
app.addEventListener('click',async event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.mode){mode=button.dataset.mode;render();return;}
 if(button.id==='refresh')return guarded(button,reload);
 if(button.id==='find')return guarded(button,async()=>{const result=await api('find_transactions',{source_site:selectedSite,search:el('search').value,from_date:el('from-date').value,to_date:el('to-date').value});transactions=result.rows;hasMore=result.has_more;selected.clear();el('transaction-table').innerHTML=transactionRows();el('selected-count').textContent='0 selected';});
 if(['assign','assign-question'].includes(button.id))return guarded(button,async()=>{if(button.id==='assign'&&!selected.size)throw new Error('Select at least one transaction.');reviewYear=Number(el('assign-year')?.value||reviewYear);const ids=await api('assign',{tax_year:reviewYear,client:selectedClient,source_site:selectedSite,question:el('question').value,line_ids:button.id==='assign'?[...selected]:[],due_date:el('due-date').value},true);selected.clear();transactions=[];items=await api('list_reviews',{tax_year:reviewYear});mode='inbox';render();message(ids.length+' review item'+(ids.length===1?'':'s')+' assigned.');});
 if(button.dataset.sendAnswer)return guarded(button,async()=>{const card=button.closest('[data-task]'),item=items.find(t=>t.name===button.dataset.sendAnswer);await api('answer',{name:item.name,explanation:card.querySelector('[data-answer-text]').value,classification:card.querySelector('[data-answer-use]').value,percentage:Number(card.querySelector('[data-answer-percentage]').value),suggested_category:card.querySelector('[data-answer-category]').value,expected_modified:item.modified},true);await reload();message('Your answer has been sent to your accountant.');});
 if(button.dataset.review)return guarded(button,async()=>{const card=button.closest('[data-task]'),item=items.find(t=>t.name===button.dataset.id);await api('review',{name:item.name,action:button.dataset.review,note:card.querySelector('[data-review-note]').value,expected_modified:item.modified},true);await reload();message(button.dataset.review==='Reviewed'?'Review complete. No ledger changes were posted.':'Follow-up requested.');});
});
let previewOwner=null;
let reviewYear=2026,clientOverview=null,clientSection='home',clientEntity='',clientFocus=0;
const friendlyStatus={Open:'Open','Follow-up':'More information needed',Answered:'Accountant reviewing',Reviewed:'Resolved'};
const friendlyUse={Business:'Business',Private:'Personal',Personal:'Personal',Transfer:'Personal transfer',Rental:'Rental',Mixed:'Split',Unsure:'Not sure',Other:'Other'};
function kindGroup(item){return item.kind==='Document'?'documents':item.kind==='Transaction'?'transactions':'questions';}
function clientEntities(){return clientOverview?.entities||[];}
function progressCards(){return clientEntities().map(e=>`<section class="panel entity-card"><h2>${esc(e.label)}</h2><p class="big-count">${e.total-e.resolved} <small>items remaining</small></p><progress max="${e.total||1}" value="${e.resolved}"></progress><p class="sub">${e.resolved} of ${e.total} resolved · ${e.reviewing} awaiting accountant review</p><div class="entity-counts"><span>Transactions <strong>${e.transactions}</strong></span><span>Documents <strong>${e.documents}</strong></span><span>Questions <strong>${e.questions}</strong></span></div><button class="primary" data-continue-entity="${esc(e.site)}"${e.waiting?'':' disabled'}>Continue review</button></section>`).join('');}
function clientHeader(){return `${previewOwner?`<div class="note"><strong>Read-only preview: ${esc(profile.full_name)}</strong> · No messages or answers are sent.<button id="exit-client-preview">Return to accountant desk</button></div>`:''}<div class="intro"><p class="eyebrow">YOUR CLIENT WORKSPACE</p><h1>${reviewYear} Tax &amp; Accounts Review</h1><p>Review the items your accountant has selected. Start with anything waiting for your answer.</p></div><div class="review-controls"><label>Tax year<select id="review-year">${[2025,2026,2027,2028].map(y=>`<option${y===reviewYear?' selected':''}>${y}</option>`).join('')}</select></label><label>Account<select id="review-entity"><option value="">All my permitted accounts</option>${clientEntities().map(e=>`<option value="${esc(e.site)}"${clientEntity===e.site?' selected':''}>${esc(e.label)}</option>`).join('')}</select></label><button id="refresh-v2">Refresh</button></div>`;}
function clientNavigation(){const labels=[['home','Overview'],['transactions','Transactions to review'],['documents','Missing documents'],['questions','Questions / decisions'],['progress','Progress']];return `<nav class="tabs client-tabs" aria-label="Review areas">${labels.map(([key,label])=>`<button data-client-section="${key}" class="${clientSection===key?'active':''}">${label}</button>`).join('')}</nav>`;}
function queue(){let rows=items.filter(t=>(!clientEntity||t.source_site===clientEntity)&&(['queue','answers'].includes(clientSection)||kindGroup(t)===clientSection));if(clientSection==='answers')return rows.filter(t=>['Answered','Reviewed'].includes(t.status));return rows.filter(t=>['Open','Follow-up'].includes(t.status)).sort((a,b)=>(a.status==='Follow-up'?0:1)-(b.status==='Follow-up'?0:1)||String(a.due_date||'9999').localeCompare(String(b.due_date||'9999')));}
function currentUse(t){const raw=t.transaction?.classification;return ({Personal:'Private','Mixed spend':'Mixed',Business:'Business',Transfer:'Transfer',Rental:'Rental',Private:'Private'})[raw]||null;}
function attachmentLinks(t){return (t.attachments||[]).map(f=>`<li><a href="/api/method/frappe_books.review_portal.download_document?${new URLSearchParams({name:t.name,file_id:f.name})}">Download ${esc(f.file_name)}</a></li>`).join('');}
function clientTransaction(t){const row=t.transaction||{},use=t.classification||currentUse(t)||'Unsure',income=Number(row.money_in)>0&&row.source_kind!=='ledger';const buttons=income?[['Business','Business income'],['Transfer','Personal transfer'],['Rental','Rental'],['Other','Other'],['Unsure','Not sure']]:[['Business','Business'],['Private','Personal'],['Mixed','Split'],['Unsure','Not sure']];return `<div class="transaction-head"><p>${esc(row.transaction_date)} · ${money(row.money_out||row.money_in)}</p><h2>${esc(row.description||t.item_title)}</h2></div>${currentUse(t)?`<p>We currently classified this as <strong>${esc(friendlyUse[currentUse(t)])}</strong>. Is that correct?</p>`:'<p>Your accountant would like your help identifying this transaction.</p>'}<div class="choice-row" role="group" aria-label="How should this be treated?">${currentUse(t)?`<button type="button" data-choice="${currentUse(t)}">Correct</button>`:''}${buttons.map(([value,label])=>`<button type="button" data-choice="${value}" aria-pressed="${use===value}">${label}</button>`).join('')}</div><input type="hidden" data-v2-use value="${esc(use)}"><div class="split-panel"${use==='Mixed'?'':' hidden'} data-v2-split><label>What percentage relates to the business or rental?<input type="range" min="1" max="99" step="0.01" value="${Number(t.percentage||row.business_percentage)||50}" data-v2-range></label><label>Business or rental share (%)<input type="number" min="0.01" max="99.99" step="0.01" value="${Number(t.percentage||row.business_percentage)||50}" data-v2-percentage></label><p data-v2-split-label>Business/rental ${Number(t.percentage||row.business_percentage)||50}% | Personal ${100-(Number(t.percentage||row.business_percentage)||50)}%</p><label class="check-label"><input type="checkbox" data-v2-rule${t.propose_rule?' checked':''}>Suggest this split for similar payments, subject to accountant approval</label></div><details class="field"><summary>Bank transaction and statement reference</summary><p>${esc(row.description)}<br>Reference: ${esc(row.reference||'Not supplied')}<br>Statement: ${esc(row.bank_statement||row.parent||'See transaction reference')}<br>Current category: ${esc(row.offset_account||'Awaiting allocation')}</p></details>`;}
function reviewOne(t,index,total){const done=t.status==='Reviewed',doc=t.kind==='Document';return `<section class="panel focus-card" data-v2-task="${esc(t.name)}"><div class="filters"><span class="tag">${esc(friendlyStatus[t.status])}</span><span class="muted">${esc(t.company)} · ${esc(t.kind)}</span></div><p class="muted">Item ${index+1} of ${total}${t.due_date?' · Due '+esc(t.due_date):''}</p>${t.kind==='Transaction'?clientTransaction(t):`<h2 class="request-title">${esc(t.item_title||t.question)}</h2>`}<p class="question">${esc(t.question)}</p>${t.review_note?`<div class="note"><strong>Your accountant’s note</strong><br>${esc(t.review_note)}</div>`:''}${done?`<p class="note">${esc(t.answer)}</p>`:`${doc?`<label class="field">Upload document<input type="file" data-v2-file accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx"></label><p class="muted">Private upload · PDF, JPG, PNG, DOCX or XLSX · Maximum 10 MB</p>`:''}<label class="field">${doc?'Comment (optional)':'Your comment or answer'}<textarea data-v2-comment maxlength="4000" placeholder="${doc?'Anything your accountant should know about this document':'Explain what this was for, or tell your accountant what you are unsure about'}">${esc(t.answer||'')}</textarea></label><button class="primary field" data-v2-submit="${esc(t.name)}"${previewOwner?' disabled':''}>${doc?'Upload document':'Send answer'}</button>`}${t.attachments?.length?`<h3>Uploaded documents</h3><ul>${attachmentLinks(t)}</ul>`:''}<div class="actions"><button data-v2-prev${index===0?' disabled':''}>Previous</button><button data-v2-next${index>=total-1?' disabled':''}>Next item</button></div><p class="foot">Your accountant checks your answer before changing the accounts.</p></section>`;}
function clientProgress(){const rows=clientEntities().filter(e=>!clientEntity||e.site===clientEntity);return `<section class="panel"><h2>Your review progress</h2><p class="sub">This reflects assigned review items only. Your accountant will confirm when the accounts and tax work are ready.</p>${rows.map(e=>`<div class="progress-line"><strong>${esc(e.label)}</strong><progress max="${e.total||1}" value="${e.resolved}"></progress><p>${e.resolved} of ${e.total} resolved · ${e.waiting} waiting for you · ${e.reviewing} accountant reviewing</p></div>`).join('')}<ol class="journey"><li>Data collected</li><li>Accountant classified</li><li class="current">Client review + missing documents</li><li>Allocation decisions</li><li>Accountant final review</li><li>Trial balance</li><li>AFS</li><li>Tax</li></ol><p class="muted">The journey shows the review stage of this portal; later accounting and tax milestones are not marked complete automatically.</p></section>`;}
function renderClientV2(){let content;if(clientSection==='home')content=`<div class="entity-grid">${progressCards()}</div><button data-client-section="answers">View my answers and resolved items</button>`;else if(clientSection==='progress')content=clientProgress();else{const rows=queue();clientFocus=Math.max(0,Math.min(clientFocus,rows.length-1));content=rows.length?reviewOne(rows[clientFocus],clientFocus,rows.length):`<div class="panel empty"><strong>No items waiting here</strong>${clientSection==='answers'?'Your answers will appear here.':'Your accountant will assign specific items when your help is needed.'}</div>`;}app.innerHTML=clientHeader()+clientNavigation()+content;}
function managerRequests(){const current=profile.clients.find(c=>c.email===selectedClient);return `<div class="intro"><h1>Documents, questions and decisions</h1><p>Request only what is needed. Clients receive a specific task in their own workspace; no email is sent automatically.</p></div><section class="panel field"><div class="grid"><label>Client<select id="request-client">${options(profile.clients.map(c=>[c.email,c.label]),selectedClient)}</select></label><label>Entity<select id="request-source">${options((current?.sources||[]).map(s=>[s,profile.sources[s]]),selectedSite)}</select></label><label>Request type<select id="request-kind">${options([['Document','Missing document'],['Decision','Question / allocation decision'],['Question','General question']],'Document')}</select></label><label>Tax year<input id="request-year" type="number" min="2000" max="2100" value="${reviewYear}"></label></div><label class="field">Title<input id="request-title" maxlength="140" placeholder="e.g. Medical aid tax certificate, rental repairs support, property split"></label><label class="field">Question or instructions<textarea id="request-question" maxlength="4000" placeholder="Explain exactly what the client should upload or confirm."></textarea></label><label class="field">Due date (optional)<input id="request-due" type="date"></label><button id="create-request" class="primary field">Assign request to client portal</button></section>`;}
function render(){if(!profile.accountant)return renderClientV2();if(mode==='requests'||mode==='progress'){app.innerHTML=`<div class="tabs"><button data-mode="assign">Assign transactions</button><button data-mode="inbox">Answers and follow-ups</button><button data-mode="requests">Documents / questions</button><button data-mode="progress">Progress</button><button id="preview-client">Preview client view</button></div>`+(mode==='requests'?managerRequests():`<h1>${reviewYear} client review progress</h1><div class="entity-grid">${progressCards()}</div>`);return;}renderLegacy();}
function updateSplit(card,value){card.querySelector('[data-v2-percentage]').value=value;card.querySelector('[data-v2-range]').value=value;card.querySelector('[data-v2-split-label]').textContent=`Business/rental ${value}% | Personal ${(100-Number(value)).toFixed(2)}%`;}
app.addEventListener('input',e=>{if(e.target.matches('[data-v2-range],[data-v2-percentage]'))updateSplit(e.target.closest('[data-v2-task]'),e.target.value);});
app.addEventListener('change',async e=>{const target=e.target;if(target.id==='review-year'){reviewYear=Number(target.value);clientFocus=0;await reload();}if(target.id==='review-entity'){clientEntity=target.value;clientFocus=0;render();}if(target.id==='request-client'){selectedClient=target.value;selectedSite=profile.clients.find(c=>c.email===selectedClient)?.sources[0]||'';render();}if(target.id==='request-source')selectedSite=target.value;});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.clientSection){clientSection=b.dataset.clientSection;clientFocus=0;render();return;}
 if(b.dataset.continueEntity){if(profile.accountant){mode='inbox';render();return;}clientEntity=b.dataset.continueEntity;clientSection='queue';clientFocus=0;render();return;}
 if(b.hasAttribute('data-v2-next')||b.hasAttribute('data-v2-prev')){clientFocus+=b.hasAttribute('data-v2-next')?1:-1;render();return;}

 if(b.id==='preview-client')return guarded(b,async()=>{if(!selectedClient)throw new Error('Choose a client first.');previewOwner=profile;try{await reload();}catch(error){profile=previewOwner;previewOwner=null;throw error;}});
 if(b.id==='exit-client-preview'){profile=previewOwner;previewOwner=null;clientSection='home';clientEntity='';await reload();return;}
 if(b.id==='refresh-v2')return guarded(b,reload);
 if(b.dataset.choice){const card=b.closest('[data-v2-task]');card.querySelector('[data-v2-use]').value=b.dataset.choice;card.querySelector('[data-v2-split]').hidden=b.dataset.choice!=='Mixed';card.querySelectorAll('[data-choice]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));return;}
 if(b.id==='create-request')return guarded(b,async()=>{reviewYear=Number(el('request-year').value);await api('create_request',{client:selectedClient,source_site:selectedSite,kind:el('request-kind').value,title:el('request-title').value,question:el('request-question').value,tax_year:Number(el('request-year').value),due_date:el('request-due').value},true);await reload();message('Request assigned to the client portal.');});
 if(b.dataset.v2Submit)return guarded(b,async()=>{const t=items.find(t=>t.name===b.dataset.v2Submit),card=b.closest('[data-v2-task]'),comment=card.querySelector('[data-v2-comment]').value.trim();if(t.kind==='Document'){const file=card.querySelector('[data-v2-file]').files[0];if(!file)throw new Error('Choose a document to upload.');if(file.size>10*1024*1024)throw new Error('The document must be 10 MB or smaller.');const form=new FormData();form.append('name',t.name);form.append('comment',comment);form.append('expected_modified',t.modified);form.append('file',file);const response=await fetch('/api/method/frappe_books.review_portal.upload_document',{method:'POST',credentials:'same-origin',headers:{'X-Frappe-CSRF-Token':document.body.dataset.csrf},body:form});const data=await response.json();if(!response.ok){let text='The document could not be uploaded.';try{text=JSON.parse(JSON.parse(data._server_messages)[0]).message.replace(/<[^>]*>/g,'');}catch{}throw new Error(text);}}else{const use=card.querySelector('[data-v2-use]')?.value||'Unsure';await api('answer',{name:t.name,explanation:comment||(t.kind==='Transaction'?`Client selected ${friendlyUse[use]||use}.`:''),classification:use,percentage:Number(card.querySelector('[data-v2-percentage]')?.value||0),propose_rule:!!card.querySelector('[data-v2-rule]')?.checked,expected_modified:t.modified},true);}clientFocus=0;await reload();message('Sent to your accountant. You can continue with the next item.');});
 if(b.dataset.approveSplit)return guarded(b,async()=>{const card=b.closest('[data-task]'),t=items.find(t=>t.name===b.dataset.approveSplit);await api('approve_rule',{name:t.name,match_text:card.querySelector('[data-rule-match]').value,note:card.querySelector('[data-rule-note]').value,expected_modified:t.modified},true);await reload();message('Split rule approved. Review matching transactions in bulk allocation before posting.');});
});

(async()=>{try{profile=await api('profile');el('user-name').textContent=profile.full_name||profile.user;if(profile.accountant){selectedClient=profile.clients[0]?.email||'';selectedSite=profile.clients[0]?.sources[0]||'';}await reload();}catch(e){app.innerHTML='<div class="panel empty"><strong>Unable to load review inbox</strong>Please sign in with your client or accountant account.</div>';message(e.message,true);}})();
</script>
</body></html>
